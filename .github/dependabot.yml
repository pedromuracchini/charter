version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      # Keeps Dependabot's commits inside the Conventional Commits convention
      # the `commits` CI job enforces on every PR.
      prefix: "build"
    groups:
      dev-dependencies:
        dependency-type: "development"
        patterns: ["*"]
