name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    # Conventional Commits are the source the CHANGELOG is generated from, so the
    # convention is enforced rather than merely agreed. Only PRs have a base/head
    # range to check; a push to main has already passed through one.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: commitizen check
        run: >
          uvx --from commitizen cz check
          --rev-range ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        # --locked everywhere: a lockfile that no longer matches pyproject.toml
        # fails the job rather than being silently regenerated, so what CI
        # resolved is what a contributor's `uv sync` resolves.
        run: uv sync --locked --extra all
      - name: ruff
        run: uv run ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --extra all
      - name: mypy
        run: uv run mypy src/charter

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every supported interpreter on Linux, where most of the interesting
        # version differences are; macOS and Windows only on the oldest and
        # newest supported version, which is where a path, asyncio or threading
        # divergence would surface. A full 3x4 grid is twelve jobs for very
        # little extra signal.
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --extra all --python ${{ matrix.python-version }}
      - name: Assert the optional dependencies really imported
        # The adapter and otel tests guard themselves with `pytest.importorskip`,
        # so a failed resolution or a broken wheel turns into a silent skip and
        # the extras suite goes green having exercised no adapter at all.
        run: >
          uv run --python ${{ matrix.python-version }} python -c
          "import agents, langchain_core, langgraph, mcp, opentelemetry.sdk; print('optional deps ok')"
      - name: pytest
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.13'
        run: uv run --python ${{ matrix.python-version }} pytest -q
      - name: pytest with coverage
        # One leg carries the coverage gate. Running it on all eight would
        # report the same number eight times, and platform-conditional branches
        # would make the threshold flap between them.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: >
          uv run --python ${{ matrix.python-version }} pytest
          --cov=charter --cov-report=xml --cov-report=term-missing --cov-fail-under=90
      - name: Upload coverage.xml
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  test-no-extras:
    # The optional-dependency story is entirely graceful degradation:
    # `otel/config.py` falls back to no-ops without `opentelemetry`, the
    # adapters only attempt their framework imports lazily inside
    # `applies_to()`, and `import charter` must pull in neither. A job that
    # installs every extra exercises none of that. This is the one that catches
    # an accidental hard dependency on an optional package.
    name: test (no extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install the project and its dev tooling only
        run: uv sync --locked
      - name: Assert no optional dependency leaked into the base install
        run: |
          uv run python - <<'PY'
          import importlib.util

          import charter  # must not require any extra

          optional = ("opentelemetry", "langchain_core", "langgraph", "mcp", "agents")
          present = [name for name in optional if importlib.util.find_spec(name) is not None]
          assert not present, f"optional packages unexpectedly installed: {present}"
          print(f"charter {charter.__version__} imports with no extras installed")
          PY
      - name: pytest
        run: uv run pytest -q

  docs:
    name: docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Assemble docs/ from the repository markdown and the package API
        run: uv run --group docs python scripts/build_docs.py
      - name: Build the site
        # --strict turns a broken internal link, or a module mkdocstrings cannot
        # import, into a build failure.
        run: uv run --group docs mkdocs build --strict

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, test-no-extras, docs]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build package
        run: uv build
      - name: twine check
        run: uvx twine check dist/*
      - name: Smoke-test the built wheel in a clean environment
        # `uv sync` installs the project from the source tree, so it proves
        # nothing about the artifact that actually gets uploaded — a missing
        # package directory or a broken console entry point only shows up when
        # the wheel is installed on its own.
        run: |
          set -euo pipefail
          uv venv /tmp/smoke
          VIRTUAL_ENV=/tmp/smoke uv pip install dist/*.whl
          /tmp/smoke/bin/python -c "import charter; print(charter.__version__)"
          /tmp/smoke/bin/charter --version
      - name: Verify the sdist ships the tests and examples
        # `source-include` is easy to break without noticing, and a security
        # library whose sdist cannot be tested is one no downstream packager can
        # verify.
        run: |
          set -euo pipefail
          # Read the listing once into a variable rather than piping into
          # `grep -q`: grep exits at the first match and closes the pipe, tar
          # takes SIGPIPE, and `pipefail` then reports 141 for a passing check.
          listing="$(tar tzf dist/*.tar.gz)"
          grep -q '/tests/' <<<"$listing"
          grep -q '/examples/' <<<"$listing"
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
