name: Release

# Publishing is tag-driven: push a `vX.Y.Z` tag and this builds, verifies and
# uploads. The full CI matrix runs again here rather than trusting the branch
# run, because a tag can point at any commit.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --extra otel --extra langgraph --extra openai-agents --extra mcp --python ${{ matrix.python-version }}
      - name: ruff
        run: uv run --python ${{ matrix.python-version }} ruff check .
      - name: mypy
        run: uv run --python ${{ matrix.python-version }} mypy src/tollgate
      - name: pytest
        run: uv run --python ${{ matrix.python-version }} pytest -q

  build:
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Build sdist and wheel
        run: uv build
      - name: Fail if the tag does not match the built version
        # A tag that disagrees with pyproject would publish the wrong version
        # under the right name, which cannot be undone on PyPI.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(uv run python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$built" ]; then
            echo "tag $tag does not match pyproject version $built" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted publishing: PyPI mints a short-lived token from this OIDC
      # identity, so no long-lived API token has to live in repo secrets.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
