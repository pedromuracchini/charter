name: Release

# Publishing is tag-driven: push a `vX.Y.Z` tag and this builds, verifies and
# uploads. The full CI matrix runs again here rather than trusting the branch
# run, because a tag can point at any commit.
#
# Every action here is pinned to a commit SHA, not a tag. A mutable tag on a
# third-party action is a supply-chain hole in any workflow, and this is the one
# workflow that holds a PyPI publishing identity. Dependabot updates the SHAs
# and keeps the trailing `# vX` comment in step.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --extra all --python ${{ matrix.python-version }}
      - name: ruff
        run: uv run --python ${{ matrix.python-version }} ruff check .
      - name: mypy
        run: uv run --python ${{ matrix.python-version }} mypy src/charter
      - name: pytest
        run: uv run --python ${{ matrix.python-version }} pytest -q

  build:
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - name: Build sdist and wheel
        run: uv build
      - name: Fail if the tag does not match the built version
        # A tag that disagrees with pyproject would publish the wrong version
        # under the right name, which cannot be undone on PyPI.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(uv run python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$built" ]; then
            echo "tag $tag does not match pyproject version $built" >&2
            exit 1
          fi
      - name: twine check
        # Catches a README that renders as plain text on PyPI, or metadata PyPI
        # will reject — both of which are only fixable by burning a version
        # number once the upload has happened.
        run: uvx twine check dist/*
      - name: Smoke-test the built wheel in a clean environment
        run: |
          set -euo pipefail
          uv venv /tmp/smoke
          VIRTUAL_ENV=/tmp/smoke uv pip install dist/*.whl
          /tmp/smoke/bin/python -c "import charter; print(charter.__version__)"
          /tmp/smoke/bin/charter --version
      - name: Extract the release notes from CHANGELOG.md
        # `--generate-notes` produces a raw commit list, which is a worse
        # changelog than the one this project already hand-writes and enforces
        # commit conventions in order to produce.
        run: |
          uv run python scripts/changelog_section.py "${GITHUB_REF_NAME#v}" > release-notes.md
          cat release-notes.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted publishing: PyPI mints a short-lived token from this OIDC
      # identity, so no long-lived API token has to live in repo secrets. The
      # same identity signs the attestations below.
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          # Stated explicitly rather than left to the action's default: PEP 740
          # attestations are what lets a consumer verify these artifacts came
          # from this workflow in this repository, and a default that changes
          # under us would silently drop that guarantee.
          attestations: true
          print-hash: true

  github-release:
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-notes
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --notes-file release-notes.md
          --verify-tag
