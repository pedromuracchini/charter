name: Docs

# Deploy only. The *build* is checked on every pull request by the `docs` job in
# ci.yml, which runs the identical two commands — duplicating the PR trigger
# here would just build the same site twice per PR.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Assemble docs/ from the repository markdown and the package API
        # The docs toolchain lives in the locked `docs` dependency group rather
        # than in a `--with` string here: mkdocs 2.0 drops the plugin system
        # with no migration path, so the pin has to be resolved and locked, not
        # re-resolved on every run.
        run: uv run --locked --group docs python scripts/build_docs.py
      - name: Build the site
        # --strict turns a broken internal link into a build failure.
        run: uv run --locked --group docs mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
