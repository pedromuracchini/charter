name: Docs

on:
  push:
    branches: [main]
  # Build (but don't deploy) on PRs, so a broken link fails review, not main.
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  # MkDocs 2.0 removes the plugin system with no migration path, which would
  # break the material theme. Pinned deliberately, not incidentally.
  DOCS_DEPS: "mkdocs>=1.6,<2 mkdocs-material>=9.5,<10"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Assemble docs/ from the repository markdown
        run: uv run python scripts/build_docs.py
      - name: Build the site
        # --strict turns a broken internal link into a build failure.
        run: uv run --with "${{ env.DOCS_DEPS }}" mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site/

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
