name: Bug report
description: Something behaves differently from what the docs say
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not report a security vulnerability here** — see
        [SECURITY.md](../blob/main/SECURITY.md) for private disclosure.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: >
        The smallest policy + tool call that shows the problem. Because policies
        are plain Python, this is usually a dozen lines.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Chokepoint version
      description: "`uv run chokepoint --version`"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
    validations:
      required: true
  - type: textarea
    id: ledger
    attributes:
      label: Relevant ledger event, if any
      description: >
        The `LedgerEvent` for the call that misbehaved often pins the cause
        immediately. Redact arguments first — they are recorded verbatim.
      render: json
