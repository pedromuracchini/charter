site_name: Tollgate
site_description: Deterministic, code-defined guardrails for AI agent tool calls
site_url: https://tollgate-dev.github.io/tollgate/
repo_url: https://github.com/tollgate-dev/tollgate
repo_name: tollgate-dev/tollgate
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - tables

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Contributing: contributing.md
  - Security: security.md
  - Changelog: changelog.md
