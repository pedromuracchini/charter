site_name: Charter
site_description: Deterministic, code-defined guardrails for AI agent tool calls
site_url: https://pedromuracchini.github.io/charter/
repo_url: https://github.com/pedromuracchini/charter
repo_name: pedromuracchini/charter
# No `edit_uri` / `content.action.edit`: every page under `docs/` is generated
# by `scripts/build_docs.py` from a source file elsewhere in the repo, so an
# "edit this page" link would point at a path that does not exist on the
# default branch. Edit the source (README/CLAUDE/... or the docstrings) instead.

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            filters: ["!^_"]
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - tables

# The `Reference` entries mirror `REFERENCE_MODULES` in scripts/build_docs.py,
# which generates the stub page each one points at. Keep the two in step.
nav:
  - Home: index.md
  - Architecture: architecture.md
  - Reference:
      - Overview: reference/index.md
      - Package API: reference/charter.md
      - Core:
          - GuardContext: reference/charter/core/context.md
          - guard: reference/charter/core/decorator.md
          - CharterInterceptor: reference/charter/core/interceptor.md
          - Policy and PolicySet: reference/charter/core/policy_set.md
          - ReversibleAction: reference/charter/core/reversible.md
          - Escalation interface: reference/charter/core/escalation.md
          - Decisions: reference/charter/decisions.md
          - CallState: reference/charter/state.md
          - Redaction: reference/charter/redaction.md
      - Policy library: reference/charter/policies.md
      - Escalation handlers: reference/charter/escalation.md
      - Framework adapters: reference/charter/adapters.md
      - Multi-agent: reference/charter/multiagent.md
      - Ledger: reference/charter/ledger.md
      - Reports: reference/charter/report.md
      - Linter: reference/charter/linter.md
      - OpenTelemetry: reference/charter/otel.md
      - Testing utilities: reference/charter/testing.md
  - Contributing: contributing.md
  - Security: security.md
  - Changelog: changelog.md
