[project]
name = "tollgate"
version = "0.1.0"
description = "Deterministic, code-defined guardrails for AI agent tool calls"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Pedro Muracchini", email = "bonadioar@gmail.com" }
]
requires-python = ">=3.11"
keywords = [
    "ai-agents",
    "guardrails",
    "llm",
    "policy",
    "safety",
    "security",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/tollgate-dev/tollgate"
Repository = "https://github.com/tollgate-dev/tollgate"
Issues = "https://github.com/tollgate-dev/tollgate/issues"
Changelog = "https://github.com/tollgate-dev/tollgate/blob/main/CHANGELOG.md"

[project.scripts]
tollgate = "tollgate.cli.main:main"

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.43.0",
    "opentelemetry-sdk>=1.43.0",
]
langgraph = [
    "langchain-core>=0.3",
    "langgraph>=0.2",
]
openai-agents = [
    "openai-agents>=0.1",
]

[build-system]
requires = ["uv_build>=0.9.11,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["tollgate"]
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["langchain_core.*", "langgraph.*", "crewai.*", "claude_agent_sdk.*", "agents.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
