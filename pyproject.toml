[project]
name = "charter"
version = "0.1.0"
description = "Deterministic, code-defined guardrails for AI agent tool calls"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Pedro Muracchini", email = "bonadioar@gmail.com" }
]
requires-python = ">=3.11"
keywords = [
    "ai-agents",
    "guardrails",
    "llm",
    "policy",
    "safety",
    "security",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/pedromuracchini/charter"
Repository = "https://github.com/pedromuracchini/charter"
Issues = "https://github.com/pedromuracchini/charter/issues"
Changelog = "https://github.com/pedromuracchini/charter/blob/main/CHANGELOG.md"

[project.scripts]
charter = "charter.cli.main:main"

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.43.0",
    "opentelemetry-sdk>=1.43.0",
]
langgraph = [
    "langchain-core>=0.3",
    "langgraph>=0.2",
]
openai-agents = [
    "openai-agents>=0.1",
]
mcp = [
    # Capped below 2.0 deliberately. mcp 2.x renames `FastMCP` to `MCPServer`,
    # moves the low-level handle from `_mcp_server` to `_lowlevel_server`, and
    # replaces the `request_handlers[CallToolRequest]` table with a
    # method-keyed one behind `get_request_handler`/`add_request_handler` —
    # every internal `adapters/mcp.py:guard_mcp_server` reaches for. Until the
    # adapter speaks both, an uncapped range hands users a broken extra.
    "mcp>=1.2,<3",
]
# Everything at once, for `pip install charter[all]`. Kept as a recursive
# reference rather than a duplicated dependency list so it cannot drift out of
# sync with the individual extras above.
all = [
    "charter[otel,langgraph,openai-agents,mcp]",
]

[build-system]
requires = ["uv_build>=0.9.11,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The sdist is what distributions and reproducible-build tooling consume, and a
# security library whose tests cannot be run from its source archive is one
# nobody downstream can verify. `examples/` goes along because CLAUDE.md and the
# README both point at those files by path.
source-include = ["tests/**", "examples/**"]

[dependency-groups]
dev = [
    "commitizen>=4",
    "hypothesis>=6.100",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
    "mkdocstrings[python]>=0.26",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4", "PTH", "TID"]

[tool.ruff.format]
# Stated explicitly (all defaults) so `ruff format` is the project's formatter
# of record rather than whatever each contributor's editor happens to run.
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = false

[tool.mypy]
python_version = "3.11"
packages = ["charter"]
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["langchain_core.*", "langgraph.*", "agents.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# --strict-markers turns a typo'd `@pytest.mark.asyncoi` into an error instead
# of a silently-skipped guarantee; --strict-config does the same for this table.
addopts = "--strict-markers --strict-config"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["charter"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "pragma: no cover",
]

[tool.commitizen]
# Commit messages are the source the CHANGELOG is generated from; `cz check` runs
# over every PR's commit range in CI. Stated explicitly rather than relying on the
# tool default so the convention is discoverable from the manifest.
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
